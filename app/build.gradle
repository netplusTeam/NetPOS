apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.github.sgtsilvio.gradle.android-retrofix'
apply plugin: 'kotlin-kapt'
apply plugin:  'dagger.hilt.android.plugin'
// Apply the Crashlytics Gradle plugin
apply plugin: 'com.google.firebase.crashlytics'

def appPropertiesFile = rootProject.file("app-settings.properties")
def appProperties = new Properties()
appProperties.load(new FileInputStream(appPropertiesFile))
def appModeProd = appProperties["env.use.mode.production"]

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    signingConfigs {
        netpos_signing_config {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }
    compileSdkVersion 31
//    buildToolsVersion "29.0.3"
    buildFeatures.dataBinding = true
    ndkVersion "21.3.6528147"
    defaultConfig {
        vectorDrawables.useSupportLibrary = true
        applicationId "com.woleapp.netpos"
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 144
        versionName "1.1.144"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        def environmentPath
        if (appModeProd == "true")
            environmentPath = appProperties["env.path.production"]
        else
            environmentPath = appProperties["env.path.staging"]
        buildConfigField "Boolean", "APPMODE_PROD", appModeProd
        def envPropertiesFile = rootProject.file(environmentPath)
        def envProperties = new Properties()
        envProperties.load(new FileInputStream(envPropertiesFile))
        for (String key : envProperties.keySet()) {
            buildConfigField "String", key.replaceAll("\\.", "_").toUpperCase(), envProperties[key]
        }
        Properties netPosProperties = new Properties()
        netPosProperties.load(rootProject.file("local.properties").newDataInputStream())
        buildConfigField("String", "STRING_DEFAULT_BASE_URL", "\"${netPosProperties.getProperty("STRING_DEFAULT_BASE_URL")}\"")
        buildConfigField("String", "STRING_ZENITH_BASE_URL", "\"${netPosProperties.getProperty("STRING_ZENITH_BASE_URL")}\"")
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.netpos_signing_config
            buildConfigField "String", "BUILD_VARIANT", "\"debug\""
            ndk {
                abiFilters "armeabi-v7a", "x86"
            }
            applicationIdSuffix ".debug"
        }
        release {
            signingConfig signingConfigs.netpos_signing_config
            buildConfigField "String", "BUILD_VARIANT", "\"release\""
            debuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/io.netty.versions.properties'
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }

    flavorDimensions "whiteLabels"
    productFlavors {
        netpos {
            dimension "whiteLabels"
        }
        zenith {
            dimension "whiteLabels"
            applicationIdSuffix ".zenith"
        }
        wema {
            dimension "whiteLabels"
            applicationIdSuffix ".wema"
        }
        providus {
            dimension "whiteLabels"
            applicationIdSuffix ".providus"
        }
        konga {
            dimension "whiteLabels"
            applicationIdSuffix ".konga"
        }
        wemacashout {
            dimension "whiteLabels"
            applicationIdSuffix ".wemaagent"
        }
        heritage {
            dimension "whiteLabels"
            applicationIdSuffix ".heritage"
        }
        aellacredit{
            dimension "whiteLabels"
            applicationIdSuffix ".aellacredit"
        }
        tingopay{
            dimension "whiteLabels"
            applicationIdSuffix ".tingopay"
        }
    }

    variantFilter { variant ->
        def name_types = variant.flavors*.name
        def name = name_types.join()
        if (variant.buildType.name == "release" && name.contains("dev")) {
            setIgnore(true)
        }
    }

    sourceSets {
        wema {
            java.srcDirs('src/defaults/java')
        }
        netpos {
            java.srcDirs('src/defaults/java')
        }
        konga {
            java.srcDirs('src/defaults/java')
        }
        providus {
            java.srcDirs('src/defaults/java')
        }
        wemacashout{
            java.srcDirs('src/defaults/java')
        }
        heritage {
            java.srcDirs('src/defaults/java')
        }
        aellacredit {
            java.srcDirs('src/defaults/java')
        }
        tingopay {
            java.srcDirs('src/defaults/java')
        }
    }

}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.5'
    implementation("commons-codec:commons-codec:1.15")
    implementation("commons-lang:commons-lang:2.6")
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.fragment:fragment-ktx:1.4.1'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    //rx
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation "io.reactivex.rxjava2:rxkotlin:2.4.0"

    //epms
    implementation project(path: ':epmslib-release')
    implementation 'net.sf.j8583:j8583:1.12.0'

    // Nibss Direct
//    implementation project (path: ':nibssDirect')

    //netpos sdk
    implementation "com.netpluspay.netpossdk:netpossdk:1.0.24"
    //implementation project(path: ':netpossdk')

    //Timber
    implementation 'com.jakewharton.timber:timber:4.7.1'

    //android lifecycle components
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"

    //room
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-rxjava2:$room_version"

    //retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.9.0'
    implementation("com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.2")

    // xml Converter
    implementation('com.squareup.retrofit2:converter-simplexml:2.9.0') {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'stax', module: 'stax'
        exclude group: 'xpp3', module: 'xpp3'
    }

    //easyprefs
    implementation 'com.pixplicity.easyprefs:library:1.9.0'

    //JWT
    implementation 'com.auth0:java-jwt:3.10.0'
    implementation 'com.auth0.android:jwtdecode:2.0.0'

    //viewpager2
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    //MQTT
    implementation 'com.hivemq:hivemq-mqtt-client:1.2.1'
    implementation "com.hivemq:hivemq-mqtt-client-websocket:1.2.1"
    implementation 'net.sourceforge.streamsupport:android-retrostreams:1.7.2'
    implementation 'net.sourceforge.streamsupport:android-retrofuture:1.7.2'

    implementation 'pub.devrel:easypermissions:3.0.0'
    implementation 'com.google.zxing:core:3.4.0'

//    //Eclipse MQTT
//    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.1.0'
//    implementation 'org.eclipse.paho:org.eclipse.paho.android.service:1.1.1'

    //glide
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    kapt 'com.github.bumptech.glide:compiler:4.11.0'

    //paging
    implementation "androidx.paging:paging-runtime:2.1.2"

    implementation "androidx.paging:paging-runtime-ktx:3.1.1"

    //preference
    implementation("androidx.preference:preference-ktx:1.2.0")

    //workmanager
    def work_version = "2.5.0"
    implementation "androidx.work:work-runtime-ktx:$work_version"

//    //firebase
//    implementation platform('com.google.firebase:firebase-bom:29.1.0')
//    implementation 'com.google.firebase:firebase-messaging'
//    implementation 'com.google.firebase:firebase-messaging-ktx'
    // Firebase
    implementation platform('com.google.firebase:firebase-bom:30.4.1')
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'

    // Declare the dependencies for the Crashlytics and Analytics libraries
    // When using the BoM, you don't specify versions in Firebase library dependencies
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    debugImplementation 'com.amitshekhar.android:debug-db:1.0.6'

    implementation "com.google.dagger:hilt-android:2.38.1"
    kapt "com.google.dagger:hilt-compiler:2.38.1"
}
apply plugin: 'com.google.gms.google-services'